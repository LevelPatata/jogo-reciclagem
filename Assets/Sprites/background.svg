<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfc8"/>
      <stop offset="100%" stop-color="#d8ccb0"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8a888"/>
      <stop offset="100%" stop-color="#988870"/>
    </linearGradient>
    <linearGradient id="hud_bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2035"/>
      <stop offset="100%" stop-color="#232b42"/>
    </linearGradient>
    <linearGradient id="esteira_surf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="8%"  stop-color="#484848"/>
      <stop offset="50%" stop-color="#505050"/>
      <stop offset="92%" stop-color="#484848"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="metal_h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="35%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="metal_rolo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="30%" stop-color="#d8d8d8"/>
      <stop offset="60%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="suporte_v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58606e"/>
      <stop offset="50%" stop-color="#7a8494"/>
      <stop offset="100%" stop-color="#58606e"/>
    </linearGradient>
    <linearGradient id="piso_tile_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0b090"/>
      <stop offset="100%" stop-color="#a09070"/>
    </linearGradient>
    <radialGradient id="luz_janela" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8e8f8" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="luz_spot" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fffae0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fffae0" stop-opacity="0"/>
    </radialGradient>

    <!-- Padrão tijolo -->
    <pattern id="tijolo" width="100" height="36" patternUnits="userSpaceOnUse">
      <rect x="2" y="2"  width="44" height="14" rx="1" fill="#c8a870" opacity="0.22"/>
      <rect x="52" y="2" width="44" height="14" rx="1" fill="#c8a870" opacity="0.22"/>
      <rect x="2" y="20" width="94" height="14" rx="1" fill="#c8a870" opacity="0.18"/>
    </pattern>
    <!-- Padrão piso -->
    <pattern id="piso_grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="90" height="90" rx="3" fill="#00000012"/>
    </pattern>

    <!-- Sombras -->
    <filter id="drop_shadow" x="-4%" y="-4%" width="108%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#00000040"/>
    </filter>
    <filter id="shadow_light" x="-2%" y="-2%" width="104%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000028"/>
    </filter>

    <!-- Máscara slot lixeira -->
    <clipPath id="clip_slot">
      <rect width="240" height="300" rx="8"/>
    </clipPath>
  </defs>

  <!-- ══════════════════════════════════════════
       1. FUNDO PAREDE
  ══════════════════════════════════════════ -->
  <rect width="1920" height="1080" fill="url(#parede)"/>
  <rect width="1920" height="1080" fill="url(#tijolo)"/>

  <!-- ══════════════════════════════════════════
       2. BARRA HUD TOPO
       Reservado para Tempo | Score | Leva
       Os textos TMP ficam aqui em cima
  ══════════════════════════════════════════ -->
  <rect x="0" y="0" width="1920" height="80" fill="url(#hud_bar)"/>
  <!-- Borda inferior brilhante -->
  <rect x="0" y="76" width="1920" height="4" fill="#4a6fa5" opacity="0.6"/>
  <!-- Separadores verticais -->
  <line x1="640"  y1="10" x2="640"  y2="70" stroke="#4a6fa5" stroke-width="1.5" opacity="0.5"/>
  <line x1="1280" y1="10" x2="1280" y2="70" stroke="#4a6fa5" stroke-width="1.5" opacity="0.5"/>
  <!-- Ícone zona Tempo (esquerda) -->
  <text x="80" y="54" font-family="Arial, sans-serif" font-size="22" fill="#6ab0f0" opacity="0.35" font-weight="bold">⏱</text>
  <!-- Ícone zona Score (centro) -->
  <text x="924" y="54" font-family="Arial, sans-serif" font-size="22" fill="#f0c060" opacity="0.35" font-weight="bold">★</text>
  <!-- Ícone zona Leva (direita) -->
  <text x="1560" y="54" font-family="Arial, sans-serif" font-size="22" fill="#80d080" opacity="0.35" font-weight="bold">▲</text>

  <!-- ══════════════════════════════════════════
       3. PAREDE — decorações (não interferem com gameplay)
  ══════════════════════════════════════════ -->
  <!-- Faixa de rodapé teto -->
  <rect x="0" y="80" width="1920" height="32" fill="#2a3248"/>

  <!-- Luminárias de teto (5×) -->
  <g fill="none">
    <!-- Luminária 1 -->
    <rect x="178" y="112" width="84" height="14" rx="4" fill="#e8e0c0"/>
    <rect x="185" y="122" width="70" height="6"  rx="2" fill="#fffae0"/>
    <ellipse cx="220" cy="130" rx="50" ry="30" fill="url(#luz_spot)"/>
    <!-- Luminária 2 -->
    <rect x="558" y="112" width="84" height="14" rx="4" fill="#e8e0c0"/>
    <rect x="565" y="122" width="70" height="6"  rx="2" fill="#fffae0"/>
    <ellipse cx="600" cy="130" rx="50" ry="30" fill="url(#luz_spot)"/>
    <!-- Luminária 3 -->
    <rect x="918" y="112" width="84" height="14" rx="4" fill="#e8e0c0"/>
    <rect x="925" y="122" width="70" height="6"  rx="2" fill="#fffae0"/>
    <ellipse cx="960" cy="130" rx="50" ry="30" fill="url(#luz_spot)"/>
    <!-- Luminária 4 -->
    <rect x="1278" y="112" width="84" height="14" rx="4" fill="#e8e0c0"/>
    <rect x="1285" y="122" width="70" height="6"  rx="2" fill="#fffae0"/>
    <ellipse cx="1320" cy="130" rx="50" ry="30" fill="url(#luz_spot)"/>
    <!-- Luminária 5 -->
    <rect x="1638" y="112" width="84" height="14" rx="4" fill="#e8e0c0"/>
    <rect x="1645" y="122" width="70" height="6"  rx="2" fill="#fffae0"/>
    <ellipse cx="1680" cy="130" rx="50" ry="30" fill="url(#luz_spot)"/>
  </g>

  <!-- Janelas (apenas decorativas, fora da área de jogo) -->
  <!-- Janela esq. -->
  <g transform="translate(50, 155)">
    <rect width="170" height="120" rx="6" fill="#b8d8f0" stroke="#90b8d0" stroke-width="5"/>
    <rect width="170" height="120" rx="6" fill="url(#luz_janela)"/>
    <line x1="85"  y1="0"   x2="85"  y2="120" stroke="#90b8d0" stroke-width="3"/>
    <line x1="0"   y1="60"  x2="170" y2="60"  stroke="#90b8d0" stroke-width="3"/>
    <rect x="-4" y="-4" width="178" height="128" rx="8" fill="none" stroke="#6898b0" stroke-width="7"/>
  </g>
  <!-- Janela centro-esq. -->
  <g transform="translate(380, 155)">
    <rect width="170" height="120" rx="6" fill="#b8d8f0" stroke="#90b8d0" stroke-width="5"/>
    <rect width="170" height="120" rx="6" fill="url(#luz_janela)"/>
    <line x1="85"  y1="0"   x2="85"  y2="120" stroke="#90b8d0" stroke-width="3"/>
    <line x1="0"   y1="60"  x2="170" y2="60"  stroke="#90b8d0" stroke-width="3"/>
    <rect x="-4" y="-4" width="178" height="128" rx="8" fill="none" stroke="#6898b0" stroke-width="7"/>
  </g>
  <!-- Janela centro -->
  <g transform="translate(875, 155)">
    <rect width="170" height="120" rx="6" fill="#b8d8f0" stroke="#90b8d0" stroke-width="5"/>
    <rect width="170" height="120" rx="6" fill="url(#luz_janela)"/>
    <line x1="85"  y1="0"   x2="85"  y2="120" stroke="#90b8d0" stroke-width="3"/>
    <line x1="0"   y1="60"  x2="170" y2="60"  stroke="#90b8d0" stroke-width="3"/>
    <rect x="-4" y="-4" width="178" height="128" rx="8" fill="none" stroke="#6898b0" stroke-width="7"/>
  </g>
  <!-- Janela centro-dir. -->
  <g transform="translate(1370, 155)">
    <rect width="170" height="120" rx="6" fill="#b8d8f0" stroke="#90b8d0" stroke-width="5"/>
    <rect width="170" height="120" rx="6" fill="url(#luz_janela)"/>
    <line x1="85"  y1="0"   x2="85"  y2="120" stroke="#90b8d0" stroke-width="3"/>
    <line x1="0"   y1="60"  x2="170" y2="60"  stroke="#90b8d0" stroke-width="3"/>
    <rect x="-4" y="-4" width="178" height="128" rx="8" fill="none" stroke="#6898b0" stroke-width="7"/>
  </g>
  <!-- Janela dir. -->
  <g transform="translate(1700, 155)">
    <rect width="170" height="120" rx="6" fill="#b8d8f0" stroke="#90b8d0" stroke-width="5"/>
    <rect width="170" height="120" rx="6" fill="url(#luz_janela)"/>
    <line x1="85"  y1="0"   x2="85"  y2="120" stroke="#90b8d0" stroke-width="3"/>
    <line x1="0"   y1="60"  x2="170" y2="60"  stroke="#90b8d0" stroke-width="3"/>
    <rect x="-4" y="-4" width="178" height="128" rx="8" fill="none" stroke="#6898b0" stroke-width="7"/>
  </g>

  <!-- ══════════════════════════════════════════
       4. SUPORTES DA ESTEIRA
  ══════════════════════════════════════════ -->
  <!-- Coluna esquerda (atrás do rolo) -->
  <rect x="58"   y="310" width="36" height="390" rx="4" fill="url(#suporte_v)" filter="url(#shadow_light)"/>
  <!-- Colunas intermediárias -->
  <rect x="470"  y="390" width="28" height="310" rx="3" fill="url(#suporte_v)" filter="url(#shadow_light)"/>
  <rect x="848"  y="390" width="28" height="310" rx="3" fill="url(#suporte_v)" filter="url(#shadow_light)"/>
  <rect x="1228" y="390" width="28" height="310" rx="3" fill="url(#suporte_v)" filter="url(#shadow_light)"/>
  <rect x="1608" y="390" width="28" height="310" rx="3" fill="url(#suporte_v)" filter="url(#shadow_light)"/>
  <!-- Coluna direita -->
  <rect x="1826" y="310" width="36" height="390" rx="4" fill="url(#suporte_v)" filter="url(#shadow_light)"/>

  <!-- ══════════════════════════════════════════
       5. ESTRUTURA DA ESTEIRA
       Centro da esteira: y 310–470
       (Lixo aparece SOBRE a superfície da esteira)
  ══════════════════════════════════════════ -->
  <!-- Calha superior (metal) -->
  <rect x="60" y="305" width="1800" height="32" rx="5" fill="url(#metal_h)" filter="url(#drop_shadow)"/>
  <!-- Superfície da esteira -->
  <rect x="60" y="337" width="1800" height="108" fill="url(#esteira_surf)" filter="url(#drop_shadow)"/>
  <!-- Reflexo topo esteira -->
  <rect x="60" y="337" width="1800" height="16" rx="0" fill="#ffffff" opacity="0.07"/>
  <!-- Calha inferior (metal) -->
  <rect x="60" y="445" width="1800" height="32" rx="5" fill="url(#metal_h)"/>

  <!-- Segmentos do cinto -->
  <g stroke="#1e1e1e" stroke-width="1.8" opacity="0.55">
    <line x1="140"  y1="337" x2="140"  y2="445"/>
    <line x1="220"  y1="337" x2="220"  y2="445"/>
    <line x1="300"  y1="337" x2="300"  y2="445"/>
    <line x1="380"  y1="337" x2="380"  y2="445"/>
    <line x1="460"  y1="337" x2="460"  y2="445"/>
    <line x1="540"  y1="337" x2="540"  y2="445"/>
    <line x1="620"  y1="337" x2="620"  y2="445"/>
    <line x1="700"  y1="337" x2="700"  y2="445"/>
    <line x1="780"  y1="337" x2="780"  y2="445"/>
    <line x1="860"  y1="337" x2="860"  y2="445"/>
    <line x1="940"  y1="337" x2="940"  y2="445"/>
    <line x1="1020" y1="337" x2="1020" y2="445"/>
    <line x1="1100" y1="337" x2="1100" y2="445"/>
    <line x1="1180" y1="337" x2="1180" y2="445"/>
    <line x1="1260" y1="337" x2="1260" y2="445"/>
    <line x1="1340" y1="337" x2="1340" y2="445"/>
    <line x1="1420" y1="337" x2="1420" y2="445"/>
    <line x1="1500" y1="337" x2="1500" y2="445"/>
    <line x1="1580" y1="337" x2="1580" y2="445"/>
    <line x1="1660" y1="337" x2="1660" y2="445"/>
    <line x1="1740" y1="337" x2="1740" y2="445"/>
    <line x1="1780" y1="337" x2="1780" y2="445"/>
  </g>

  <!-- Rolo esquerdo -->
  <ellipse cx="60"   cy="391" rx="32" ry="54" fill="url(#metal_rolo)" stroke="#707070" stroke-width="3" filter="url(#shadow_light)"/>
  <ellipse cx="60"   cy="391" rx="16" ry="35" fill="#909090" opacity="0.45"/>
  <ellipse cx="60"   cy="391" rx="5"  ry="10" fill="#b0b0b0"/>
  <!-- Rolo direito -->
  <ellipse cx="1860" cy="391" rx="32" ry="54" fill="url(#metal_rolo)" stroke="#707070" stroke-width="3" filter="url(#shadow_light)"/>
  <ellipse cx="1860" cy="391" rx="16" ry="35" fill="#909090" opacity="0.45"/>
  <ellipse cx="1860" cy="391" rx="5"  ry="10" fill="#b0b0b0"/>

  <!-- Caixa motor (esquerda) -->
  <rect x="0" y="356" width="60" height="70" rx="6" fill="#283040" stroke="#3a4858" stroke-width="2" filter="url(#shadow_light)"/>
  <circle cx="30" cy="391" r="20" fill="#1a2030" stroke="#506080" stroke-width="2"/>
  <circle cx="30" cy="391" r="10" fill="#405070"/>
  <circle cx="30" cy="391" r="4"  fill="#8ab0d0"/>
  <rect x="8"  y="362" width="18" height="6" rx="2" fill="#405070"/>
  <rect x="8"  y="374" width="18" height="4" rx="1" fill="#405070"/>
  <!-- Luz status motor -->
  <circle cx="50" cy="363" r="5" fill="#22c55e"/>
  <circle cx="50" cy="363" r="5" fill="#22c55e" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Painel controle (direita) -->
  <rect x="1860" y="350" width="60" height="90" rx="6" fill="#283040" stroke="#3a4858" stroke-width="2" filter="url(#shadow_light)"/>
  <rect x="1868" y="358" width="44" height="14" rx="3" fill="#1a2030"/>
  <text x="1890" y="369" font-family="monospace" font-size="9" fill="#22c55e" text-anchor="middle">ON</text>
  <circle cx="1876" cy="385" r="7" fill="#22c55e"/>
  <circle cx="1898" cy="385" r="7" fill="#ef4444"/>
  <rect x="1868" y="400" width="44" height="5" rx="2" fill="#405070"/>
  <rect x="1868" y="412" width="44" height="5" rx="2" fill="#405070"/>
  <rect x="1868" y="424" width="44" height="5" rx="2" fill="#405070"/>

  <!-- ══════════════════════════════════════════
       6. PLACA LATERAL ESQUERDA (decorativa, fora do centro)
  ══════════════════════════════════════════ -->
  <rect x="18" y="500" width="44" height="130" rx="6" fill="#283040" stroke="#3a4858" stroke-width="2"/>
  <rect x="24" y="508" width="32" height="8"  rx="2" fill="#22c55e" opacity="0.8"/>
  <rect x="24" y="522" width="32" height="4"  rx="1" fill="#405070"/>
  <rect x="24" y="532" width="32" height="4"  rx="1" fill="#405070"/>
  <rect x="24" y="542" width="32" height="4"  rx="1" fill="#405070"/>
  <rect x="24" y="554" width="32" height="38" rx="3" fill="#1a2030"/>
  <text x="40" y="578" font-family="monospace" font-size="11" fill="#22c55e" text-anchor="middle">042</text>

  <!-- ══════════════════════════════════════════
       7. PISO
  ══════════════════════════════════════════ -->
  <!-- Sombra da esteira no piso -->
  <ellipse cx="960" cy="700" rx="880" ry="22" fill="#00000030"/>

  <!-- Piso principal -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#piso)"/>
  <rect x="0" y="700" width="1920" height="380" fill="url(#piso_grid)" opacity="0.5"/>
  <!-- Rodapé parede/piso -->
  <rect x="0" y="696" width="1920" height="8" fill="#806040"/>
  <rect x="0" y="700" width="1920" height="6" fill="#a08060" opacity="0.5"/>

  <!-- ══════════════════════════════════════════
       8. ZONAS DAS LIXEIRAS (5 slots no piso)
       Espaçamento: 5 slots em 1920px → cada slot 240px, gap 96px
       Slot positions x: 96, 432, 768, 1104, 1440  (centralizados)
       Nota: ajuste conforme posição real das suas Lixeira prefabs
  ══════════════════════════════════════════ -->

  <!-- ─── Slot 1: PAPEL (azul) ─── -->
  <g transform="translate(96, 720)">
    <rect width="240" height="8"  rx="4" fill="#3b82f6"/>
    <rect y="8" width="240" height="280" rx="0" fill="#3b82f6" opacity="0.07"/>
    <!-- Seta indicativa no chão -->
    <path d="M120 260 L100 240 L110 240 L110 200 L130 200 L130 240 L140 240 Z" fill="#3b82f6" opacity="0.3"/>
    <!-- Label -->
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700" opacity="0.8">PAPEL</text>
  </g>

  <!-- ─── Slot 2: PLÁSTICO (vermelho) ─── -->
  <g transform="translate(432, 720)">
    <rect width="240" height="8"  rx="4" fill="#ef4444"/>
    <rect y="8" width="240" height="280" rx="0" fill="#ef4444" opacity="0.07"/>
    <path d="M120 260 L100 240 L110 240 L110 200 L130 200 L130 240 L140 240 Z" fill="#ef4444" opacity="0.3"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700" opacity="0.8">PLÁSTICO</text>
  </g>

  <!-- ─── Slot 3: METAL (amarelo) ─── -->
  <g transform="translate(768, 720)">
    <rect width="240" height="8"  rx="4" fill="#ca8a04"/>
    <rect y="8" width="240" height="280" rx="0" fill="#ca8a04" opacity="0.07"/>
    <path d="M120 260 L100 240 L110 240 L110 200 L130 200 L130 240 L140 240 Z" fill="#ca8a04" opacity="0.3"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" fill="#ca8a04" text-anchor="middle" font-weight="700" opacity="0.8">METAL</text>
  </g>

  <!-- ─── Slot 4: VIDRO (verde) ─── -->
  <g transform="translate(1104, 720)">
    <rect width="240" height="8"  rx="4" fill="#16a34a"/>
    <rect y="8" width="240" height="280" rx="0" fill="#16a34a" opacity="0.07"/>
    <path d="M120 260 L100 240 L110 240 L110 200 L130 200 L130 240 L140 240 Z" fill="#16a34a" opacity="0.3"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700" opacity="0.8">VIDRO</text>
  </g>

  <!-- ─── Slot 5: ORGÂNICO (marrom) ─── -->
  <g transform="translate(1440, 720)">
    <rect width="240" height="8"  rx="4" fill="#854d0e"/>
    <rect y="8" width="240" height="280" rx="0" fill="#854d0e" opacity="0.07"/>
    <path d="M120 260 L100 240 L110 240 L110 200 L130 200 L130 240 L140 240 Z" fill="#854d0e" opacity="0.3"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" fill="#854d0e" text-anchor="middle" font-weight="700" opacity="0.8">ORGÂNICO</text>
  </g>

  <!-- ══════════════════════════════════════════
       9. LINHA DE REFERÊNCIA (comentário visual)
       Zona central reservada para o Painel de Game Over
       (Paineis Canvas ficam por cima deste SVG, não há conflito)
  ══════════════════════════════════════════ -->
  <!-- Nenhum elemento no centro entre y=480-680 — área limpa para GameObjects e Canvas -->

</svg>
